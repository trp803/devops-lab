# Docker Compose для WordPress + MySQL
# Изменён: 2026-03-24 — пароли вынесены в .env файл (были в открытом виде)
# Требует наличия файла .env (скопируй из .env.example)

version: '3.8'

services:
  # MySQL — база данных для WordPress
  db:
    image: mysql:8.0
    container_name: wordpress-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      # mysqladmin ping — утилита проверки MySQL, встроена в образ
      # -h localhost — подключаться к локальному серверу
      # --silent — без лишнего вывода
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5        # MySQL медленно инициализируется при первом запуске
      start_period: 60s # Первый старт MySQL может занять до минуты

  # WordPress — CMS (система управления контентом)
  wordpress:
    image: wordpress:latest
    container_name: wordpress-app
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    depends_on:
      db:
        condition: service_healthy  # Ждём пока MySQL не будет готова принимать соединения

    healthcheck:
      # curl -f — завершить с ошибкой если HTTP статус >= 400
      # WordPress отвечает на / даже до завершения установки
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
