version: '3.8'

services:
  # MongoDB — документоориентированная NoSQL база данных
  # Хранит данные в JSON-подобном формате (BSON)
  mongodb:
    image: mongo:6.0              # Официальный образ MongoDB версии 6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"  # Стандартный порт MongoDB — доступен снаружи для подключения
    environment:
      # Значения из .env файла
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}      # root пользователь БД
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}  # пароль root пользователя
      MONGO_INITDB_DATABASE: ${MONGO_DB}             # База данных создаётся автоматически
    volumes:
      - mongodb_data:/data/db  # /data/db — где MongoDB хранит данные
      # Скрипты в этой папке выполняются при первом запуске контейнера (инициализация)
      - ./init:/docker-entrypoint-initdb.d

  # Mongo Express — веб-интерфейс для управления MongoDB
  # Позволяет просматривать коллекции, документы, делать запросы через браузер
  mongo-express:
    image: mongo-express          # Официальный образ Mongo Express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"  # Веб-интерфейс доступен в браузере на порту 8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}      # Логин для подключения к MongoDB
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}  # Пароль
      # URL подключения к MongoDB: mongodb://user:pass@host:port/
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false  # Отключаем Basic Auth для Mongo Express (для удобства разработки)
    depends_on:
      - mongodb  # Mongo Express стартует только после MongoDB

volumes:
  mongodb_data:  # Данные MongoDB — сохраняются между перезапусками
