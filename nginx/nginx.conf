# Конфигурация Nginx как reverse proxy
# Reverse proxy — посредник между пользователем и сервисами:
# Пользователь → Nginx → нужный сервис
# Преимущества: единая точка входа, SSL в одном месте, балансировка нагрузки

# events — настройки обработки соединений
events {
    worker_connections 1024;  # Максимум одновременных соединений на один воркер-процесс
}

http {
    # Формат логов: IP, пользователь, время, запрос, статус, размер, referrer, user-agent
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;  # Лог всех запросов
    error_log  /var/log/nginx/error.log warn;   # Лог ошибок (уровень: warn и выше)

    # Gzip сжатие — уменьшает размер ответа, ускоряет загрузку
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;  # Что сжимать

    # upstream — группа серверов для проксирования
    # Если добавить несколько строк server — Nginx будет балансировать между ними

    # Node.js приложение
    upstream nodeapp {
        server nodeapp:3000;  # 'nodeapp' — имя сервиса в docker-compose
    }

    # Grafana (мониторинг)
    upstream grafana {
        server grafana:3000;  # Grafana внутри контейнера слушает 3000
    }

    # Prometheus (метрики)
    upstream prometheus {
        server prometheus:9090;
    }

    # Виртуальный хост — обрабатываем все запросы на порту 80
    server {
        listen 80;  # Слушаем входящие HTTP соединения

        # location / — обрабатываем все запросы которые не совпали с другими блоками
        location / {
            proxy_pass http://nodeapp;  # Перенаправляем на Node.js приложение
            # Передаём заголовки чтобы приложение знало реальный IP клиента
            proxy_set_header Host $host;                        # Оригинальный Host заголовок
            proxy_set_header X-Real-IP $remote_addr;           # Реальный IP клиента
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Цепочка прокси
        }

        # location /grafana/ — запросы к /grafana/* уходят в Grafana
        location /grafana/ {
            proxy_pass http://grafana/;  # Слеш в конце важен: /grafana/foo → /foo в Grafana
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # location /prometheus/ — запросы к /prometheus/* уходят в Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /health — эндпоинт для проверки работоспособности Nginx
        # Используется в healthcheck скриптах и load balancer'ах
        location /health {
            access_log off;               # Не логируем healthcheck запросы (засоряют логи)
            return 200 'OK';             # Просто возвращаем 200 OK
            add_header Content-Type text/plain;  # Указываем тип ответа
        }
    }
}
