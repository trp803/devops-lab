# Nginx конфиг с SSL/HTTPS (продакшн версия)
# Используется ПОСЛЕ получения сертификата через Certbot
#
# Как использовать:
# 1. Получи сертификат: bash ../ssl/certbot-init.sh yourdomain.com
# 2. Замени nginx.conf на этот файл: cp nginx-ssl.conf nginx.conf
# 3. Перезапусти: docker compose restart nginx

events {
    worker_connections 1024;
}

http:
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstream серверы (те же что в HTTP версии)
    upstream nodeapp {
        server nodeapp:3000;
    }
    upstream grafana {
        server grafana:3000;
    }
    upstream prometheus {
        server prometheus:9090;
    }

    # ─────────────────────────────────────────
    # Сервер 1: HTTP → HTTPS редирект
    # Весь HTTP трафик перенаправляем на HTTPS
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;  # Замени на свой домен

        # /.well-known/acme-challenge — путь который Certbot использует для проверки владения доменом
        # Certbot кладёт туда файл, Let's Encrypt проверяет что файл доступен
        # Это НЕ редиректим на HTTPS — Certbot работает только по HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;   # Папка которую монтирует Certbot
        }

        # Всё остальное — редирект на HTTPS
        # 301 = постоянный редирект (браузер запомнит и больше не будет ходить по HTTP)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────
    # Сервер 2: HTTPS (основной)
    # ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name yourdomain.com www.yourdomain.com;

        # Пути к сертификатам Let's Encrypt
        # Certbot автоматически создаёт эти файлы
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Современные SSL настройки (рекомендуемые Mozilla)
        # TLSv1.2 и TLSv1.3 — безопасные версии (TLS 1.0 и 1.1 устарели)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Список шифрования — только стойкие алгоритмы
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Сессионный кеш — не пересогласовывать SSL при каждом запросе
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — говорим браузеру ВСЕГДА использовать HTTPS для этого домена
        # max-age=31536000 = 1 год
        # includeSubDomains — применять и для поддоменов
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Защитные заголовки
        add_header X-Frame-Options DENY;            # Запрет iframe (защита от clickjacking)
        add_header X-Content-Type-Options nosniff;  # Запрет MIME-sniffing

        # Те же location что в HTTP версии
        location / {
            proxy_pass http://nodeapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Говорим приложению что запрос по HTTPS
        }

        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /prometheus/ {
            proxy_pass http://prometheus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
