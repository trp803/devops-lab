version: '3.8'

services:

  # ─────────────────────────────────────────
  # PROMETHEUS — сбор и хранение метрик
  # Метрики — числовые показатели: CPU %, RAM, кол-во запросов, ошибки
  # Prometheus сам приходит к сервисам и "scrape" (скачивает) их метрики
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped  # Перезапускать всегда, кроме случая ручной остановки
    ports:
      - "9090:9090"  # Веб-интерфейс и API Prometheus доступны на порту 9090
    volumes:
      # Монтируем наш конфиг внутрь контейнера (ro = read-only, контейнер не может изменить)
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Named volume для хранения данных метрик между перезапусками
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

    healthcheck:
      # Prometheus имеет встроенный /-/healthy endpoint
      # Возвращает 200 OK когда сервер готов принимать запросы
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────
  # GRAFANA — визуализация метрик и логов
  # Grafana читает данные из Prometheus и Loki и строит красивые графики
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Grafana внутри слушает 3000, снаружи доступна на 3001
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123  # Пароль для входа (логин: admin)
      - GF_USERS_ALLOW_SIGN_UP=false         # Запрещаем самостоятельную регистрацию
      # Токен и chat_id Telegram бота — для алертов
      # Берутся из .env файла (не хранить в коде!)
      - GF_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GF_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Включаем unified alerting (новая система алертов Grafana)
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

    healthcheck:
      # Grafana имеет /api/health endpoint — возвращает JSON {"database":"ok"}
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # NODE EXPORTER — метрики сервера
  # Собирает метрики хост-машины: CPU, RAM, диск, сеть
  # Prometheus приходит к нему каждые 15 секунд и забирает данные
  # ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"  # Метрики доступны на /metrics этого порта
    volumes:
      # Даём доступ к системным директориям хоста (ro = только чтение)
      - /proc:/host/proc:ro   # Информация о процессах
      - /sys:/host/sys:ro     # Системная информация (железо, ядро)
      - /:/rootfs:ro          # Корневая файловая система (для метрик диска)
    command:
      - '--path.procfs=/host/proc'   # Говорим где искать /proc
      - '--path.sysfs=/host/sys'     # Говорим где искать /sys
      # Исключаем системные точки монтирования из метрик диска (не нужны)
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # ─────────────────────────────────────────
  # CADVISOR — метрики Docker контейнеров
  # Показывает CPU, RAM, сеть для каждого контейнера отдельно
  # ─────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"  # cAdvisor внутри слушает 8080, снаружи доступен на 8082
    volumes:
      - /:/rootfs:ro                          # Доступ к файловой системе для метрик диска
      - /var/run:/var/run:ro                  # Docker socket — для информации о контейнерах
      - /sys:/sys:ro                          # Системная информация
      - /var/lib/docker:/var/lib/docker:ro    # Данные Docker (образы, контейнеры)

  # ─────────────────────────────────────────
  # LOKI — хранение и поиск логов
  # Аналог Elasticsearch но специально для логов
  # Принимает логи от Promtail и хранит их
  # ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"  # API Loki — Promtail отправляет сюда логи, Grafana читает отсюда
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml  # Конфиг Loki
      - loki_data:/loki                               # Хранение логов между перезапусками
    command: -config.file=/etc/loki/local-config.yaml

    healthcheck:
      # Loki имеет /ready endpoint — возвращает "ready" когда готов принимать логи
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s  # Loki дольше инициализируется (создаёт индексы)

  # ─────────────────────────────────────────
  # PROMTAIL — сборщик логов
  # Читает лог-файлы Docker контейнеров и системы, отправляет в Loki
  # Аналог Filebeat/Fluentd но от команды Grafana
  # ─────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    # Нет ports: — Promtail только отправляет данные, ничего не принимает снаружи
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml  # Конфиг Promtail
      - /var/log:/var/log:ro                               # Системные логи хоста
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # Логи контейнеров
    command: -config.file=/etc/promtail/config.yml

  # ─────────────────────────────────────────
  # BLACKBOX EXPORTER — активная проверка доступности
  # Prometheus даёт ему список URL → он проверяет их и возвращает результат
  # Отвечает на вопрос: "Мой сайт доступен прямо сейчас?"
  # ─────────────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"  # UI Blackbox — можно вручную проверить URL: http://localhost:9115
    volumes:
      # Конфиг с описанием модулей проверки (http_2xx, tcp, icmp)
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

    healthcheck:
      # Blackbox имеет /-/healthy endpoint
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/-/healthy", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────
  # UPTIME KUMA — красивая страница статуса сервисов
  # Показывает % uptime за 24ч/7д/30д для каждого сервиса
  # Имеет собственную систему уведомлений (Telegram, Slack, email)
  # Настраивается через веб-интерфейс (не через файлы)
  # ─────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"  # Uptime Kuma внутри слушает 3001, снаружи доступна на 3002
    volumes:
      # Uptime Kuma хранит всё в SQLite базе внутри этого volume
      # Мониторы, история, уведомления — всё здесь
      - uptime_kuma_data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # Uptime Kuma стартует чуть дольше

# Named volumes — Docker управляет ими сам
# Данные сохраняются даже если контейнер удалён
volumes:
  prometheus_data:   # Метрики Prometheus
  grafana_data:      # Дашборды и настройки Grafana
  loki_data:         # Логи Loki
  uptime_kuma_data:  # База данных Uptime Kuma (SQLite)
