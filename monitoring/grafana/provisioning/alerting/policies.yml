# Политики маршрутизации алертов
# Определяет какой contact point получает какие алерты
# Можно настроить: critical → телефон, warning → Telegram, info → email

apiVersion: 1

policies:
  - orgId: 1

    # Receiver по умолчанию — получает ВСЕ алерты которые не попали в другие правила
    receiver: Telegram

    # group_by — группировать алерты по этим меткам
    # Вместо 10 отдельных сообщений — одно сгруппированное
    group_by: ['alertname', 'severity']

    # Ждать 30 секунд перед отправкой (вдруг придут ещё алерты в эту группу)
    group_wait: 30s

    # Минимальный интервал между повторными уведомлениями об одном алерте
    # Не спамим каждую минуту — ждём 5 минут между напоминаниями
    group_interval: 5m

    # Через сколько повторить уведомление если алерт не прошёл
    repeat_interval: 4h

    # Дочерние правила (более специфичные)
    routes:
      # Critical алерты — без задержки, повторять каждый час
      - receiver: Telegram
        matchers:
          - severity = critical      # Только алерты с меткой severity=critical
        group_wait: 10s              # Быстрее отправляем критические
        repeat_interval: 1h          # Напоминаем каждый час пока не решат
