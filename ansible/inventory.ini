# Inventory файл — список серверов которыми управляет Ansible
# Ansible читает этот файл чтобы знать куда подключаться по SSH

# [webservers] — группа серверов
# В неё входят все строки ниже до следующей группы
[webservers]
# localhost — управляем локальной машиной
# ansible_connection=local — не использовать SSH, выполнять команды напрямую
# Для реальных серверов: 192.168.1.10 или server.example.com
localhost ansible_connection=local

# [webservers:vars] — переменные для группы webservers
# Эти переменные доступны во всех плейбуках для этой группы
[webservers:vars]
ansible_user=ubuntu  # SSH пользователь для подключения к серверам
